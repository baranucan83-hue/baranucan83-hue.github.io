<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureCore X ⚡ Bunker Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family: 'Share Tech Mono', monospace;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background-color: #060907;
  color: #00ff66;
  overflow: hidden;
}

/* CRT Tarama Çizgileri Efekti */
body::after {
  content: " ";
  display: block;
  position: fixed;
  top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
  z-index: 99999;
  background-size: 100% 3px, 3px 100%;
  pointer-events: none;
}

.container{
  width: 95%; max-width: 950px; height: 96vh;
  background: rgba(8, 14, 10, 0.95);
  border: 1px solid #00ff6655;
  border-radius: 4px; padding: 20px;
  display: flex; flex-direction: column;
  box-shadow: 0 0 30px rgba(0, 255, 102, 0.15), inset 0 0 15px rgba(0, 255, 102, 0.05);
}

h1{
  text-align: center; font-size: 16px; font-weight: 700; margin-bottom: 8px;
  color: #00ff66; text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
  letter-spacing: 2px;
  border-bottom: 1px dashed #00ff6644; padding-bottom: 6px;
}

input{
  padding: 10px 14px; border: 1px solid #00ff6644; border-radius: 2px;
  margin: 4px 0; width: 100%; background: #030805; color: #00ff66; font-size: 14px;
  font-family: 'Share Tech Mono', monospace;
}
input:focus{ outline: none; border-color: #00ff66; box-shadow: 0 0 8px rgba(0, 255, 102, 0.4); }

button{
  padding: 10px 14px; border: 1px solid #00ff66; border-radius: 2px; margin: 4px 0;
  cursor: pointer; font-weight: 600; font-size: 13px; background: #00220c; color: #00ff66;
  font-family: 'Share Tech Mono', monospace; letter-spacing: 1px;
  transition: all 0.2s ease;
}
button:hover{ background: #00ff66; color: #030805; box-shadow: 0 0 10px #00ff66; }

.voice-btn { background: #022a14; border-color: #00cc55; flex: 1; }
.voice-btn.active { background: #3a0202; border-color: #ff3333; color: #ff3333; box-shadow: 0 0 10px #ff3333; }

.crypto-card {
  background: #040d08; border: 1px dashed #00ff6644; padding: 8px 12px; border-radius: 2px; margin-bottom: 6px; font-size: 11px; color: #00cc55;
}

#chat{
  flex: 1; overflow: auto; margin: 6px 0; padding: 12px; border-radius: 2px;
  background: #020503; border: 1px solid #00ff6633;
}

.message{
  padding: 8px 12px; margin-bottom: 8px; border-radius: 2px;
  background: #040d08; border-left: 3px solid #00ff66; display: flex; flex-direction: column; position: relative;
}
.message.compromised { border-left-color: #ff3333; background: #120404; color: #ff9999; }
.small{ font-size: 10px; color: #008833; margin-top: 4px; }
.delete{ background: #220000; color: #ff3333; border: 1px solid #ff3333; padding: 2px 6px; font-size: 10px; margin-top: 4px; cursor: pointer; border-radius: 2px; width: fit-content; }
.decoded{ color: #ccffdd; font-weight: 600; word-break: break-all; margin: 4px 0; font-size: 13px; }
.room-info{ display: flex; justify-content: space-between; font-size: 11px; color: #00bb55; margin-bottom: 6px; background: #040d08; padding: 6px 10px; border: 1px solid #00ff6633; }
.typing-indicator { font-size: 11px; color: #ffcc00; height: 16px; margin-bottom: 4px; }
.avatar{ width: 22px; height: 22px; border-radius: 50%; margin-right: 8px; object-fit: cover; border: 1px solid #00ff66; }
.userRow{ display: flex; align-items: center; margin-bottom: 2px; }

#loginBox, #appBox { display: flex; flex-direction: column; justify-content: center; max-width: 400px; margin: auto; width: 100%; }
#appBox { max-width: 100%; }
</style>
</head>
<body>

<div class="container">
<h1>[ SECURECORE X // SIĞINAK KONTROL TERMİNALİ ]</h1>

<!-- GİRİŞ EKRANI -->
<div id="loginBox">
  <div style="font-size: 12px; color: #00bb55; margin-bottom: 10px; text-align: center;">> KİMLİK DOĞRULAMA GEREKLİ</div>
  <input id="email" placeholder="Operatör E-posta">
  <input id="password" type="password" placeholder="Şifre">
  <input id="nickname" placeholder="Kod Adı (Takma Ad)">
  <input id="avatarURL" placeholder="Birim İkon URL (Opsiyonel)">
  <button onclick="login()">BAĞLANTI KUR [ AUTH ]</button>
</div>

<!-- UYGULAMA ANA EKRANI -->
<div id="appBox" style="display:none;flex:1;flex-direction:column;">
  <div style="display:flex; gap: 6px;">
    <input id="room" placeholder="Sığınak / Kanal Kodu" style="flex:1;">
    <input id="secretKey" placeholder="AES Frekans Anahtarı" style="flex:1;" type="password">
    <button onclick="connectRoom()" style="padding: 0 16px;">[ KANALA GİR ]</button>
  </div>
  
  <div style="display: flex; gap: 8px; margin-bottom: 6px;">
    <button id="voiceToggleBtn" class="voice-btn" onclick="toggleVoice()" disabled>🎤 ŞİFRELİ SESLİ BAĞLANTI</button>
  </div>

  <div class="crypto-card">
    > DURUM: Kombinatoryal Güvenlik Duvarı Aktif [ C-MAC Shield ]
  </div>

  <div class="room-info">
    <div id="onlineCount">AKTARILAN VERİ: 0</div>
    <div id="activeUsers">AKTİF BİRİMLER: -</div>
  </div>

  <div id="chat"></div>
  <div class="typing-indicator" id="typingStatus"></div>
  
  <input id="mesaj" placeholder="Şifreli ve mühürlü komut yazın..." disabled>
  <input type="file" id="dosya" disabled style="padding: 4px; background: #030805; border: 1px solid #00ff6644; color: #00ff66;">
  <button onclick="sendMessage()" id="sendBtn" disabled>[ KOMUTU GÖNDER & MÜHÜRLE ]</button>
</div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB9hBRTJ4BLMLpmAPxwPdbrNbk2UuAV3i4",
  authDomain: "core-chat-3be96.firebaseapp.com",
  databaseURL: "https://core-chat-3be96-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "core-chat-3be96",
  storageBucket: "core-chat-3be96.appspot.com",
  messagingSenderId: "555994455959",
  appId: "1:555994455959:web:9dbd659b1970c491042ed2"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentRoom = null;
let typingRef = null;
let presenceRef = null;
let currentUserData = null;

const M_PRIME = 1000000007;
const SYSTEM_SECRET_K = 999;

function C2(a) { return a >= 2 ? (a * (a - 1)) / 2 : 0; }
function C3(b) { return b >= 3 ? (b * (b - 1) * (b - 2)) / 6 : 0; }

function stringToNumericId(uid) {
  let hash = 0;
  for (let i = 0; i < uid.length; i++) {
    hash = (hash << 5) - hash + uid.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash % 900) + 2;
}

function generateCMAC(userId, timestamp) {
  const a = stringToNumericId(userId);
  const b = Math.floor(timestamp / 1000) % 10000 + 3;
  return (C2(a) + C3(b) + SYSTEM_SECRET_K * (a + b)) % M_PRIME;
}

function login(){
  auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("password").value)
  .then(async (uc)=>{
    currentUserData = { nickname: document.getElementById("nickname").value || "Birim-X", avatar: document.getElementById("avatarURL").value || '' };
    await db.ref("users/"+uc.user.uid).set(currentUserData);
    loginBox.style.display="none"; appBox.style.display="flex";
  }).catch(e=>alert("ERİŞİM REDDEDİLDİ: "+e.message));
}

auth.onAuthStateChanged(async u=>{
  if(u){
    loginBox.style.display="none"; appBox.style.display="flex";
    const snap = await db.ref("users/"+u.uid).get();
    currentUserData = snap.val() || { nickname: "Birim-X", avatar: "" };
  }
});

async function getKey(password){
  const enc = new TextEncoder();
  const hash = await crypto.subtle.digest("SHA-256", enc.encode(password));
  return crypto.subtle.importKey("raw", hash, {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
}
function ab2b64(buffer){ return btoa(String.fromCharCode(...new Uint8Array(buffer))); }
function b642ab(base64){ return Uint8Array.from(atob(base64), c=>c.charCodeAt(0)); }
function escapeHTML(text){ const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

let lastSent = 0;
async function sendMessage(){
  const now = Date.now();
  if(now - lastSent < 1000) return alert("SİSTEM UYARISI: Yayın limit aralığı (1 sn)");
  lastSent = now;
  
  const roomVal = document.getElementById("room").value;
  const keyVal = document.getElementById("secretKey").value;
  const mesajVal = document.getElementById("mesaj").value;
  const dosyaInput = document.getElementById("dosya");

  if(!roomVal || !keyVal || (!mesajVal && !dosyaInput.files.length)) return alert("EKSİK PARAMETRE");

  const uid = auth.currentUser.uid;
  const cmacToken = generateCMAC(uid, now);
  const key = await getKey(keyVal);
  let type = dosyaInput.files.length ? "file" : "text";
  let messageData = {};

  if(type==="text"){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,new TextEncoder().encode(mesajVal));
    const combined = new Uint8Array(iv.length + cipher.byteLength);
    combined.set(iv,0); combined.set(new Uint8Array(cipher),iv.length);
    messageData = {data:ab2b64(combined)};
  } else {
    const file = dosyaInput.files[0];
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,await file.arrayBuffer());
    const combined = new Uint8Array(iv.length + cipher.byteLength);
    combined.set(iv,0); combined.set(new Uint8Array(cipher),iv.length);
    messageData = {data:ab2b64(combined),name:file.name,type:file.type};
  }

  db.ref("rooms/"+roomVal+"/messages").push({
    message: JSON.stringify(messageData),
    uid: uid,
    nickname: currentUserData.nickname,
    avatar: currentUserData.avatar,
    time: now,
    type: type,
    cmac: cmacToken
  });

  document.getElementById("mesaj").value="";
  dosyaInput.value="";
  if(typingRef) typingRef.set(false);
}

async function connectRoom(){
  const roomVal = document.getElementById("room").value;
  const keyVal = document.getElementById("secretKey").value;
  if(!roomVal || !keyVal) return alert("Kanal kodu ve anahtar zorunludur!");
  
  if(currentRoom){ db.ref("rooms/"+currentRoom+"/messages").off(); }
  currentRoom = roomVal;
  document.getElementById("chat").innerHTML="";
  
  document.getElementById("mesaj").disabled = false;
  document.getElementById("dosya").disabled = false;
  document.getElementById("sendBtn").disabled = false;
  document.getElementById("voiceToggleBtn").disabled = false;

  const uid = auth.currentUser.uid;
  presenceRef = db.ref("rooms/"+currentRoom+"/presence/"+uid);
  presenceRef.set({nickname: currentUserData.nickname});
  presenceRef.onDisconnect().remove();

  db.ref("rooms/"+currentRoom+"/presence").on("value", s=>{
    const users = s.val();
    document.getElementById("activeUsers").textContent = "AKTİF BİRİMLER: " + (users ? Object.values(users).map(u => u.nickname).join(" | ") : "-");
  });

  db.ref("rooms/"+currentRoom+"/messages").on("child_added", async snap=>{
    const data = snap.val();
    const id = snap.key;
    const messageRef = db.ref("rooms/"+currentRoom+"/messages/"+id);

    const expectedCMAC = generateCMAC(data.uid, data.time);
    const isCompromised = (data.cmac !== expectedCMAC);

    const div = document.createElement("div");
    div.className = "message" + (isCompromised ? " compromised" : "");

    let text = isCompromised ? "[ KRİTİK UYARI: VERİ BÜTÜNLÜĞÜ BOZULDU / SAHTE İMZA ]" : "[ ŞİFRE ÇÖZÜLEMEDİ ]";
    
    if(!isCompromised){
      try{
        const key = await getKey(document.getElementById("secretKey").value);
        const msgObj = JSON.parse(data.message);
        const raw = b642ab(msgObj.data);
        const dec = await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12));
        
        if(data.type==="text"){
          text = escapeHTML(new TextDecoder().decode(dec));
        } else {
          const blob = new Blob([dec],{type:msgObj.type});
          text = `<a href="${URL.createObjectURL(blob)}" download="${escapeHTML(msgObj.name)}" style="color:#00ff66;">[DOSYA İNDİR: ${escapeHTML(msgObj.name)}]</a>`;
        }
      }catch{}
    }

    const avatarImg = data.avatar ? `<img src="${escapeHTML(data.avatar)}" class="avatar">` : '';
    div.innerHTML = `<div class="userRow">${avatarImg}<b style="color:#00ff66">${escapeHTML(data.nickname)}</b> ${isCompromised ? '<span style="color:#ff3333;font-size:10px;margin-left:auto;">[İHLAL TESPİT EDİLDİ]</span>' : ''}</div>
                     <div class="decoded">${text}</div>
                     <div class="small">${new Date(data.time).toLocaleTimeString()} // MÜHÜR: DOĞRULANDI</div>`;

    if(auth.currentUser && auth.currentUser.uid === data.uid){
      const del = document.createElement("button");
      del.textContent="[ İMHA ET ]"; del.className="delete";
      del.onclick = ()=> messageRef.remove();
      div.appendChild(del);
    }

    const chatDiv = document.getElementById("chat");
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  });
}

// WebRTC Sesli İletişim Fonksiyonları
let localStream = null; let peerConnection = null; let isVoiceActive = false;
const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

async function toggleVoice(){
  const btn = document.getElementById("voiceToggleBtn");
  if(!isVoiceActive){
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      peerConnection = new RTCPeerConnection(iceServers);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      peerConnection.ontrack = e => { document.getElementById("remoteAudio").srcObject = e.streams[0]; };
      peerConnection.onicecandidate = e => { if(e.candidate) db.ref("rooms/"+currentRoom+"/signals/"+auth.currentUser.uid).push({ candidate: e.candidate.toJSON() }); };

      const callRef = db.ref("rooms/"+currentRoom+"/calls/"+auth.currentUser.uid);
      callRef.set({ active: true }); callRef.onDisconnect().remove();

      db.ref("rooms/"+currentRoom+"/calls").on("child_added", async snap => {
        if(snap.key !== auth.currentUser.uid && peerConnection) {
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          db.ref("rooms/"+currentRoom+"/signals/"+auth.currentUser.uid).set({ type: "offer", sdp: offer });
        }
      });

      db.ref("rooms/"+currentRoom+"/signals").on("child_added", async snap => {
        const d = snap.val();
        if(snap.key !== auth.currentUser.uid && peerConnection) {
          if(d.type === "offer") {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(d.sdp));
            const ans = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(ans);
            db.ref("rooms/"+currentRoom+"/signals/"+auth.currentUser.uid).set({ type: "answer", sdp: ans });
          } else if(d.type === "answer") {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(d.sdp));
          } else if(d.candidate) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(d.candidate));
          }
        }
      });

      btn.textContent = "🛑 SESLİ BAĞLANTIYI KES"; btn.classList.add("active"); isVoiceActive = true;
    } catch(err) { alert("Mikrofon hatası: "+err.message); }
  } else {
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    if(peerConnection) { peerConnection.close(); peerConnection = null; }
    db.ref("rooms/"+currentRoom+"/calls/"+auth.currentUser.uid).remove();
    db.ref("rooms/"+currentRoom+"/signals/"+auth.currentUser.uid).remove();
    btn.textContent = "🎤 ŞİFRELİ SESLİ BAĞLANTI"; btn.classList.remove("active"); isVoiceActive = false;
  }
}
</script>
</body>
</html>
