<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureCore X ⚡</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Inter,sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  background-size: cover;
  position: relative;
  color:white;
}
.container{
  position: relative;
  z-index:1;
  width:95%;
  max-width:900px;
  height:92vh;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(10px);
  border-radius:15px;
  padding:20px;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 25px rgba(255,111,145,0.5);
  border: 1px solid rgba(255,111,145,0.3);
}
h1{
  font-family:Orbitron;
  text-align:center;
  font-size:28px;
  margin-bottom:15px;
  color:#ff6f91;
}
input{
  padding:12px;
  border:none;
  border-radius:10px;
  margin:5px 0;
  width:100%;
  background:#1c2a38;
  color:white;
  border:1px solid #ff6f91;
}
input:focus{outline:none;border:1px solid #ffd166;}
button{
  padding:10px;
  border:none;
  border-radius:10px;
  margin:5px 0;
  cursor:pointer;
  font-weight:bold;
  background:#ff6f91;
  color:white;
  transition:0.2s;
}
button:hover{opacity:0.9; transform: scale(1.02);}
#chat{
  flex:1;
  overflow:auto;
  margin:10px 0;
  padding:10px;
  border-radius:10px;
  background:#15222bcc;
  border: 1px solid rgba(255,255,255,0.05);
}
.message{
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
  background:#223843cc;
  display:flex;
  flex-direction:column;
  position:relative;
  transition: 0.3s;
}
.message:hover{box-shadow: 0 0 15px rgba(255,111,145,0.4); transform: scale(1.01);}
.small{font-size:11px;opacity:0.6;}
.delete{
  background:#ff4444;
  padding:4px 8px;
  font-size:11px;
  margin-top:5px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  width: fit-content;
}
.decoded{
  color:#ffd166;
  font-weight:bold;
  word-break: break-all;
}
.room-info{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  opacity:0.8;
  margin-bottom:5px;
  background: rgba(255,255,255,0.05);
  padding: 6px 10px;
  border-radius: 8px;
}
.typing-indicator {
  font-size: 11px;
  color: #ffd166;
  font-style: italic;
  height: 18px;
  margin-bottom: 5px;
}
.avatar{
  width:28px; height:28px; border-radius:50%; margin-right:6px; object-fit: cover;
}
.userRow{
  display:flex; align-items:center; margin-bottom: 4px;
}
</style>
</head>
<body>

<div class="container">
<h1>SecureCore X ⚡</h1>

<div id="loginBox">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Şifre">
  <input id="nickname" placeholder="Takma ad">
  <input id="avatarURL" placeholder="Profil resmi URL (opsiyonel)">
  <button onclick="login()">Giriş Yap</button>
</div>

<div id="appBox" style="display:none;flex:1;flex-direction:column;">
  <div style="display:flex; gap: 5px;">
    <input id="room" placeholder="Oda adı" style="flex:1;">
    <input id="secretKey" placeholder="Ortak Gizli Anahtar" style="flex:1;" type="password">
    <button onclick="connectRoom()" style="padding: 0 15px; margin: 5px 0;">Bağlan</button>
  </div>
  
  <div class="room-info">
    <div id="onlineCount">Mesaj Sayısı: 0</div>
    <div id="activeUsers">Aktif Odadakiler: -</div>
  </div>

  <div id="chat"></div>
  <div class="typing-indicator" id="typingStatus"></div>
  
  <input id="mesaj" placeholder="Mesaj yaz..." disabled>
  <input type="file" id="dosya" disabled>
  <button onclick="sendMessage()" id="sendBtn" disabled>Gönder</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB9hBRTJ4BLMLpmAPxwPdbrNbk2UuAV3i4",
  authDomain: "core-chat-3be96.firebaseapp.com",
  databaseURL: "https://core-chat-3be96-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "core-chat-3be96",
  storageBucket: "core-chat-3be96.appspot.com",
  messagingSenderId: "555994455959",
  appId: "1:555994455959:web:9dbd659b1970c491042ed2"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentRoom = null;
let typingRef = null;
let presenceRef = null;
const colors = ["#ff4444","#00ffff","#ffaa00","#00ff00","#ff00ff","#ff6f91"];

function login(){
  if(!nickname.value) return alert("Takma ad boş olamaz!");
  auth.signInWithEmailAndPassword(email.value, password.value)
  .then(async ()=>{
    const uid = auth.currentUser.uid;
    await db.ref("users/"+uid).set({
      nickname: nickname.value,
      avatar: avatarURL.value || ''
    });
    loginBox.style.display="none";
    appBox.style.display="flex";
  })
  .catch(e=>alert(e.message));
}

auth.onAuthStateChanged(user=>{
  if(user){loginBox.style.display="none"; appBox.style.display="flex";}
});

async function getKey(password){
  const enc = new TextEncoder();
  const hash = await crypto.subtle.digest("SHA-256", enc.encode(password));
  return crypto.subtle.importKey("raw", hash, {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
}
function ab2b64(buffer){ return btoa(String.fromCharCode(...new Uint8Array(buffer))); }
function b642ab(base64){ return Uint8Array.from(atob(base64), c=>c.charCodeAt(0)); }
function escapeHTML(text){ const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

let lastSent = 0;

async function sendMessage(){
  const now = Date.now();
  if(now - lastSent < 1000) return alert("1 saniyede bir mesaj gönderebilirsiniz");
  lastSent = now;
  if(!room.value || !secretKey.value || (!mesaj.value && !dosya.files.length)) return alert("Alanlar boş olamaz");

  const key = await getKey(secretKey.value);
  let type = dosya.files.length ? "file" : "text";
  let messageData = {};

  if(type==="text"){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const cipher = await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(mesaj.value));
    const combined = new Uint8Array(iv.length + cipher.byteLength);
    combined.set(iv,0);
    combined.set(new Uint8Array(cipher),iv.length);
    messageData = {data:ab2b64(combined)};
  } else {
    const file = dosya.files[0];
    const arrayBuffer = await file.arrayBuffer();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,arrayBuffer);
    const combined = new Uint8Array(iv.length + cipher.byteLength);
    combined.set(iv,0);
    combined.set(new Uint8Array(cipher),iv.length);
    messageData = {data:ab2b64(combined),name:file.name,type:file.type};
  }

  const userRef = db.ref("users/"+auth.currentUser.uid);
  const userData = (await userRef.get()).val();

  db.ref("rooms/"+room.value+"/messages").push({
    message: JSON.stringify(messageData),
    user: auth.currentUser.email,
    nickname: userData.nickname,
    avatar: userData.avatar || '',
    time: Date.now(),
    type: type
  });

  mesaj.value=""; dosya.value="";
  if(typingRef) typingRef.set(false);
}

// Oda Bağlantısı ve Yönetimi
async function connectRoom(){
  if(!room.value || !secretKey.value) return alert("Oda adı ve Gizli Anahtar girilmelidir!");
  
  if(currentRoom){
    db.ref("rooms/"+currentRoom+"/messages").off();
    db.ref("rooms/"+currentRoom+"/messages").off();
    if(presenceRef) presenceRef.remove();
    if(typingRef) typingRef.set(false);
  }

  currentRoom = room.value;
  chat.innerHTML="";
  
  mesaj.disabled = false;
  dosya.disabled = false;
  sendBtn.disabled = false;

  const uid = auth.currentUser.uid;
  const userRef = db.ref("users/"+uid);
  const userData = (await userRef.get()).val();

  // Presence (Aktif Kullanıcı) Entegrasyonu
  presenceRef = db.ref("rooms/"+currentRoom+"/presence/"+uid);
  presenceRef.set({nickname: userData.nickname});
  presenceRef.onDisconnect().remove();

  db.ref("rooms/"+currentRoom+"/presence").on("value", snap=>{
    const users = snap.val();
    const names = users ? Object.values(users).map(u => u.nickname).join(", ") : "-";
    activeUsers.textContent = "Aktif: " + names;
  });

  // Mesaj Dinleyicisi
  db.ref("rooms/"+currentRoom+"/messages").on("child_added", async snap=>{
    const data = snap.val();
    const id = snap.key;
    const messageRef = db.ref("rooms/"+currentRoom+"/messages/"+id);

    const div = document.createElement("div");
    div.className="message";
    const userColor = colors[data.nickname.charCodeAt(0) % colors.length];

    let text="🔒 Mesaj çözülemedi!";
    try{
      const key = await getKey(secretKey.value);
      const msgObj = JSON.parse(data.message);
      const raw = b642ab(msgObj.data);
      const iv = raw.slice(0,12);
      const cipher = raw.slice(12);
      const dec = await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,cipher);

      if(data.type==="text"){
        text = escapeHTML(new TextDecoder().decode(dec));
      } else {
        const blob = new Blob([dec],{type:msgObj.type});
        if(msgObj.type.startsWith("image/")){
          text = `<img src="${URL.createObjectURL(blob)}" style="max-width:100%;border-radius:10px;">`;
        } else {
          text = `<a href="${URL.createObjectURL(blob)}" download="${escapeHTML(msgObj.name)}" style="color:#ffd166;">${escapeHTML(msgObj.name)}</a>`;
        }
      }
    }catch{}

    const avatarImg = data.avatar ? `<img src="${escapeHTML(data.avatar)}" class="avatar">` : '';
    div.innerHTML = `<div class="userRow">${avatarImg}<b style="color:${userColor}">${escapeHTML(data.nickname)}</b></div>
                     <div class="decoded">${text}</div>
                     <div class="small">${new Date(data.time).toLocaleString()}</div>`;

    if(auth.currentUser.email===data.user){
      const del = document.createElement("button");
      del.textContent="Sil";
      del.className="delete";
      del.onclick = ()=> { messageRef.remove().catch(err=>alert("Silme hatası: "+err.message)); };
      div.appendChild(del);
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  });

  db.ref("rooms/"+currentRoom+"/messages").on("value", snap=>{
    onlineCount.textContent = "Mesaj Sayısı: " + snap.numChildren();
  });

  // Yazıyor... (Typing) Özelliği
  typingRef = db.ref("rooms/"+currentRoom+"/typing/"+uid);
  let typingTimeout;
  
  mesaj.oninput = () => {
    typingRef.set(userData.nickname);
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      typingRef.remove();
    }, 2000);
  };

  db.ref("rooms/"+currentRoom+"/typing").on("value", snap=>{
    const typingData = snap.val();
    if(!typingData) {
      typingStatus.textContent = "";
      return;
    }
    const typers = Object.entries(typingData)
      .filter(([id]) => id !== uid)
      .map(([_, name]) => name);

    if(typers.length > 0) {
      typingStatus.textContent = typers.join(", ") + " yazıyor...";
    } else {
      typingStatus.textContent = "";
    }
  });
}

mesaj.addEventListener("keypress", e=>{if(e.key==="Enter") sendMessage();});
</script>
</body>
</html>
