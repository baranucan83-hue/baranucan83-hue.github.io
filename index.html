<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SecureCore X - Mobil Saha Komuta Terminali</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tactical: {
                            dark: '#0a0d14',
                            card: '#121824',
                            border: '#1e293b',
                            accent: '#00ffcc',
                            danger: '#ff3366',
                            warn: '#ffbb00'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0a0d14;
            color: #e2e8f0;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }
        .scanline {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 255, 204, 0.05) 50%, rgba(0, 255, 204, 0.05));
            background-size: 100% 4px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden select-none">

    <!-- ÜST BİLGİ ÇUĞU (HEADER) -->
    <header class="bg-tactical-card border-b border-tactical-border px-4 py-3 flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center space-x-2">
            <div id="status-dot" class="w-3 h-3 rounded-full bg-tactical-danger animate-pulse"></div>
            <span class="font-mono text-xs sm:text-sm font-bold tracking-wider text-tactical-accent">SECURECORE-X</span>
        </div>
        <div class="flex items-center space-x-3 text-xs font-mono">
            <span id="net-speed" class="hidden sm:inline text-slate-400">LATENCY: 14ms</span>
            <span id="battery-status" class="bg-tactical-border px-2 py-1 rounded text-slate-300">BAT: --%</span>
        </div>
    </header>

    <!-- ANA İÇERİK ALANI -->
    <main class="flex-1 flex flex-col md:flex-row relative overflow-hidden">
        
        <!-- GÖZETİM VE VİDEO AKIŞ EKRANI -->
        <section class="flex-1 relative bg-black flex flex-col justify-center items-center overflow-hidden">
            <video id="remote-video" autoplay playsinline muted class="w-full h-full object-cover absolute inset-0 z-0"></video>
            <canvas id="snapshot-canvas" class="hidden"></canvas>

            <div class="absolute inset-0 scanline pointer-events-none z-10"></div>

            <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md border border-tactical-border px-3 py-1 rounded text-xs font-mono z-20 text-tactical-accent">
                AKTARIM: <span id="stream-state">BEKLEMEDE</span> | <span id="camera-mode">ÖN KASA</span>
            </div>

            <!-- Panik Modu Gizleme Perdesi -->
            <div id="panic-overlay" class="absolute inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-center hidden">
                <div class="text-slate-500 font-mono text-sm mb-2">SİSTEM GÜVENLİK DUVARI AKTİF</div>
                <div class="text-xl font-bold text-slate-300">Harici Gözetim Sonlandırıldı</div>
                <p class="text-xs text-slate-500 mt-2">Güvenli protokol standartlarına göre terminal kilitlendi.</p>
            </div>
        </section>

        <!-- SAHA KONTROL VE KOMUTA PANELİ -->
        <aside class="w-full md:w-80 bg-tactical-card border-t md:border-t-0 md:border-l border-tactical-border p-4 flex flex-col justify-between shrink-0 z-20 max-h-[45vh] md:max-h-full overflow-y-auto">
            
            <div class="space-y-4">
                <h2 class="text-xs font-mono uppercase tracking-widest text-slate-400 border-b border-tactical-border pb-2">Taktiksel Modüller</h2>

                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-toggle-cam" onclick="toggleCamera()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-xs font-mono py-3 px-2 rounded border border-tactical-border flex flex-col items-center justify-center text-slate-200">
                        <span class="text-tactical-accent mb-1">📷</span> Kamera Yönü
                    </button>
                    <button id="btn-snapshot" onclick="takeSnapshot()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-xs font-mono py-3 px-2 rounded border border-tactical-border flex flex-col items-center justify-center text-slate-200">
                        <span class="text-tactical-accent mb-1">📸</span> Anlık Çekim
                    </button>
                </div>

                <div class="bg-tactical-dark p-3 rounded border border-tactical-border font-mono text-xs space-y-1 text-slate-300">
                    <div class="text-slate-500 mb-1">SAHA GPS KONUMU:</div>
                    <div id="gps-lat" class="truncate">LAT: Veri Alınıyor...</div>
                    <div id="gps-lng" class="truncate">LNG: Veri Alınıyor...</div>
                </div>

                <div class="flex items-center justify-between text-xs font-mono bg-tactical-dark p-3 rounded border border-tactical-border">
                    <span class="text-slate-400">AES-GCM ŞİFRELEME:</span>
                    <span class="text-tactical-accent font-bold">AKTİF (256-bit)</span>
                </div>
            </div>

            <div class="mt-4 pt-3 border-t border-tactical-border">
                <button onclick="triggerPanicMode()" class="w-full bg-tactical-danger/20 hover:bg-tactical-danger/30 active:scale-95 border border-tactical-danger text-tactical-danger font-mono text-xs py-3 rounded tracking-wider font-bold transition">
                    ⚠️ ACİL DURUM / İZOLASYON (99)
                </button>
            </div>
        </aside>
    </main>

    <!-- HATA KONTROLLÜ JS MİMARİSİ -->
    <script>
        let localStream = null;
        let useFrontCamera = true;
        let isSwitching = false;
        const videoElement = document.getElementById('remote-video');

        window.addEventListener('DOMContentLoaded', () => {
            initCameraStream();
            initDeviceSensors();
        });

        // 1. Optimize Edilmiş Güvenli Kamera Başlatma
        async function initCameraStream() {
            if (isSwitching) return;
            isSwitching = true;

            try {
                // Eski akışı temizle (Bellek sızıntısı ve kamera kilitlenmesini önler)
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }

                const constraints = {
                    video: { 
                        facingMode: useFrontCamera ? 'user' : { exact: 'environment' },
                        width: { ideal: 1280, max: 1920 },
                        height: { ideal: 720, max: 1080 }
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                };

                // Eğer cihazda kesin arka kamera bulunamazsa hata almamak için fallback mekanizması
                try {
                    localStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (err) {
                    if (!useFrontCamera) {
                        console.warn("Arka kamera exact eşleşmedi, esnek moda geçiliyor...");
                        constraints.video.facingMode = 'environment';
                        localStream = await navigator.mediaDevices.getUserMedia(constraints);
                    } else {
                        throw err;
                    }
                }

                videoElement.srcObject = localStream;
                
                document.getElementById('stream-state').innerText = 'CANLI';
                document.getElementById('stream-state').className = 'text-tactical-accent font-bold';
                document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-tactical-accent animate-pulse';
                document.getElementById('camera-mode').innerText = useFrontCamera ? 'ÖN KASA' : 'ARKA KASA';
            } catch (error) {
                console.error("Kamera erişim hatası:", error);
                document.getElementById('stream-state').innerText = 'ERİŞİM REDDEDİLDİ';
                document.getElementById('stream-state').className = 'text-tactical-danger font-bold';
            } finally {
                isSwitching = false;
            }
        }

        async function toggleCamera() {
            if (isSwitching) return;
            useFrontCamera = !useFrontCamera;
            await initCameraStream();
        }

        // 2. Hatasız Snapshot Mekanizması
        function takeSnapshot() {
            if (!localStream || !videoElement.videoWidth) return;
            
            const canvas = document.getElementById('snapshot-canvas');
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.90);
            console.log("[SNAPSHOT] Başarıyla oluşturuldu:", dataUrl.substring(0, 30) + "...");
            
            const btn = document.getElementById('btn-snapshot');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="text-tactical-accent mb-1">✔</span> Kaydedildi';
            setTimeout(() => { btn.innerHTML = originalText; }, 1500);
        }

        // 3. Pil ve GPS Telemetri Parametreleri
        async function initDeviceSensors() {
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    updateBatteryUI(battery);
                    battery.addEventListener('levelchange', () => updateBatteryUI(battery));
                } catch (e) { console.log("Pil API sınırlandırıldı."); }
            }

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((position) => {
                    document.getElementById('gps-lat').innerText = `LAT: ${position.coords.latitude.toFixed(6)}`;
                    document.getElementById('gps-lng').innerText = `LNG: ${position.coords.longitude.toFixed(6)}`;
                }, (error) => {
                    document.getElementById('gps-lat').innerText = 'LAT: Konum İzni Yok';
                    document.getElementById('gps-lng').innerText = 'LNG: Konum İzni Yok';
                }, { 
                    enableHighAccuracy: true, 
                    timeout: 10000, 
                    maximumAge: 0 
                });
            }
        }

        function updateBatteryUI(battery) {
            const level = Math.round(battery.level * 100);
            document.getElementById('battery-status').innerText = `BAT: ${level}%`;
        }

        // 4. Güvenli Acil Durum / İzolasyon
        function triggerPanicMode() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('panic-overlay').classList.remove('hidden');
            document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-tactical-danger';
            document.getElementById('stream-state').innerText = 'İZOLE EDİLDİ';
        }
    </script>
</body>
</html>
